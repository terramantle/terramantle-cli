# managed by terramantle · template=gitlab/modules · v=2
# Generated by `terramantle init`; re-rendered by `terramantle upgrade`.
# Edits are overwritten — change terramantle.hcl and re-run `upgrade` instead.
#
# Emitted by `terramantle init` for artefact=modules · vcs=gitlab.
#
# An MR validates; a merge to main publishes every changed module
# to the registry and pushes its `<module>@<version>` git tag.
#
# The registry address of a module is `<org>/<name>/<provider>`, and the CLI
# derives all three from the repo: org from the manifest, and name + provider
# from the `terraform-<provider>-<name>` directory convention. A directory that
# does not follow it fails with a message saying so — pass `--provider` to
# override.
#
# Auth is keyless. `terramantle auth env --terraform` detects GITLAB_CI, reads
# the JWT that `id_tokens:` minted, and exports TF_HTTP_PASSWORD plus the
# TF_TOKEN_* registry credentials. The org must trust this project under VCS
# Trust with subject `project_path:<group>/<project>` or every call 401s.
#
# !! TAG PUSHES NEED A WRITABLE REMOTE !! `terramantle repo tag` pushes tags,
# and CI_JOB_TOKEN cannot push. Create a Project Access Token with
# `write_repository`, expose it as the masked variable GIT_PUSH_TOKEN, and the
# publish job rewrites `origin` to use it.
#
# Required CI/CD variables:
#   GIT_PUSH_TOKEN  (masked) — Project Access Token with write_repository
#   GITHUB_TOKEN    (masked) — tflint plugin downloads; without it the job shares
#                   one anonymous 60/hr GitHub API quota by runner IP.

stages: [validate, publish]

workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web"
    - when: never

variables:
  TERRAMANTLE_ORG: "acme-demo"
  TERRAMANTLE_API_URL: "https://registry.terramantle.dev"
  TOFU_VERSION: "1.13.2"
  TERRAMANTLE_CLI_VERSION: "0.9.2"
  TFLINT_VERSION: "0.65.0"
  TFDOCS_VERSION: "0.24.0"

  # Change detection diffs against the last `<module>@<version>` tag, so the
  # full history and all tags are required.
  GIT_STRATEGY: clone
  GIT_DEPTH: "0"
  GIT_SUBMODULE_STRATEGY: none

  TF_IN_AUTOMATION: "1"
  TF_INPUT: "0"
  DEBIAN_FRONTEND: noninteractive

# Job-level `id_tokens` does NOT merge with `default:id_tokens` — the job's
# definition wins outright. Keeping it in a hidden job pulled in by `extends:`
# avoids that trap, and means the `check` job gets no identity at all.
.ci_auth:
  id_tokens:
    TERRAMANTLE_ID_TOKEN:
      aud: "https://registry.terramantle.dev"

.tools:
  image: debian:stable-slim
  before_script:
    - set -eu
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends ca-certificates curl git jq tar gzip unzip coreutils
    - |
      # --- OpenTofu (pinned + checksum verified) ------------------------------
      cd /tmp
      curl --proto '=https' --tlsv1.2 -fsSLO \
        "https://github.com/opentofu/opentofu/releases/download/v${TOFU_VERSION}/tofu_${TOFU_VERSION}_linux_amd64.zip"
      curl --proto '=https' --tlsv1.2 -fsSLO \
        "https://github.com/opentofu/opentofu/releases/download/v${TOFU_VERSION}/tofu_${TOFU_VERSION}_SHA256SUMS"
      grep -F "tofu_${TOFU_VERSION}_linux_amd64.zip" "tofu_${TOFU_VERSION}_SHA256SUMS" > tofu.sha256
      sha256sum -c tofu.sha256
      unzip -oq "tofu_${TOFU_VERSION}_linux_amd64.zip" tofu -d /usr/local/bin
      chmod +x /usr/local/bin/tofu
      tofu version
    - |
      # --- Terramantle CLI (pinned release) -----------------------------------
      curl --proto '=https' --tlsv1.2 -LsSf \
        "https://github.com/terramantle/terramantle-cli/releases/download/v${TERRAMANTLE_CLI_VERSION}/cli-installer.sh" | sh
      install -m 0755 "$HOME/.cargo/bin/terramantle" /usr/local/bin/terramantle
      terramantle --version
    - cd "$CI_PROJECT_DIR"
    - git config --global --add safe.directory "$CI_PROJECT_DIR"

validate:
  stage: validate
  extends: [.tools]     # no identity needed: `modules changed` is offline
  interruptible: true
  timeout: 20m
  script:
    - tofu fmt -check -recursive -no-color .
    - terramantle modules changed
    - |
      set -eu
      if [ -z "${GITHUB_TOKEN:-}" ]; then
        echo "ERROR: CI/CD variable GITHUB_TOKEN is not set."
        echo "ERROR: 'tflint --init' downloads plugins from the GitHub API and will hit the"
        echo "ERROR: 60/hr anonymous shared-IP rate limit. Add a masked GITHUB_TOKEN variable"
        echo "ERROR: (a classic PAT with NO scopes is sufficient)."
        exit 1
      fi
      test -f "$CI_PROJECT_DIR/.tflint.hcl" || { echo "ERROR: .tflint.hcl missing at the repo root"; exit 1; }
      cd /tmp
      curl --proto '=https' --tlsv1.2 -fsSLO \
        "https://github.com/terraform-linters/tflint/releases/download/v${TFLINT_VERSION}/tflint_linux_amd64.zip"
      curl --proto '=https' --tlsv1.2 -fsSLO \
        "https://github.com/terraform-linters/tflint/releases/download/v${TFLINT_VERSION}/checksums.txt"
      grep -F "tflint_linux_amd64.zip" checksums.txt > tflint.sha256
      sha256sum -c tflint.sha256
      unzip -oq tflint_linux_amd64.zip -d /usr/local/bin
      chmod +x /usr/local/bin/tflint
      cd "$CI_PROJECT_DIR"
      tflint --version
    # `--recursive --init` in that order; a bare `--init` only does the root.
    - tflint --recursive --init --config "$CI_PROJECT_DIR/.tflint.hcl"
    - tflint --recursive --config "$CI_PROJECT_DIR/.tflint.hcl" --format compact

publish:
  stage: publish
  extends: [.tools, .ci_auth]
  interruptible: false
  resource_group: terramantle-publish-$CI_COMMIT_REF_SLUG
  timeout: 30m
  needs: ["validate"]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - when: never
  script:
    - |
      set -eu
      if [ -z "${GIT_PUSH_TOKEN:-}" ]; then
        echo "ERROR: CI/CD variable GIT_PUSH_TOKEN is not set."
        echo "ERROR: 'terramantle repo tag' pushes git tags and CI_JOB_TOKEN cannot push."
        echo "ERROR: Create a Project Access Token with write_repository and add it masked."
        exit 1
      fi
      # Rewrite origin so the tag push authenticates. The token is masked in
      # the job log by GitLab, and the remote URL is never echoed.
      git remote set-url origin \
        "https://gitlab-ci-token:${GIT_PUSH_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
      git config user.email "ci@${CI_SERVER_HOST}"
      git config user.name "Terramantle CI"
    - |
      # `modules publish` regenerates each module README between the
      # BEGIN_TF_DOCS markers when terraform-docs is on PATH, and only prints a
      # hint when it is not. Installing it here is what makes that happen.
      set -eu
      cd /tmp
      curl --proto '=https' --tlsv1.2 -fsSLO \
        "https://github.com/terraform-docs/terraform-docs/releases/download/v${TFDOCS_VERSION}/terraform-docs-v${TFDOCS_VERSION}-linux-amd64.tar.gz"
      curl --proto '=https' --tlsv1.2 -fsSLO \
        "https://github.com/terraform-docs/terraform-docs/releases/download/v${TFDOCS_VERSION}/terraform-docs-v${TFDOCS_VERSION}.sha256sum"
      grep -F "terraform-docs-v${TFDOCS_VERSION}-linux-amd64.tar.gz" \
        "terraform-docs-v${TFDOCS_VERSION}.sha256sum" > tfdocs.sha256
      sha256sum -c tfdocs.sha256
      tar -xzf "terraform-docs-v${TFDOCS_VERSION}-linux-amd64.tar.gz" terraform-docs
      install -m 0755 terraform-docs /usr/local/bin/terraform-docs
      cd "$CI_PROJECT_DIR"
      terraform-docs --version
    - terramantle modules publish --ci
    - terramantle repo tag
