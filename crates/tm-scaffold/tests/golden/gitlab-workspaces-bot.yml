# managed by terramantle · template=gitlab/workspaces · v=3
# Generated by `terramantle init`; re-rendered by `terramantle upgrade`.
# Edits are overwritten — change terramantle.hcl and re-run `upgrade` instead.
#
# Emitted by `terramantle init` for artefact=workspaces (states) · vcs=gitlab.
# Terramate stacks + OpenTofu + the Terramantle HTTP state backend.
#
# Shape: every plan goes to Terramantle's plan gate, and what it means depends
# on where it was made.
#
#   * A merge request plans every changed stack and pushes each plan with
#     `--ref mr-<iid>`. The gate's verdict passes or fails the job. A plan with
#     a ref NEVER blocks or unblocks the workspace: a failing merge request
#     must not stop an unrelated apply on main.
#   * main plans again, against the state as it is now, and pushes
#     with NO ref. That plan gates the workspace: blocked, the apply is refused
#     (planning still works) until a passing plan is pushed or it is approved.
#   * The apply job pulls that plan back from Terramantle, pinned to the
#     sha-256 the plan job recorded, and applies exactly those bytes.
#
# The plan file never becomes a job artifact. It holds the full configuration
# and every value in cleartext, so it is stored where the state is, behind the
# same access: pulling one needs write access to the workspace's state. Only
# its digest travels between jobs.
#
# Auth uses a BOT TOKEN, not OIDC — a self-managed GitLab cannot use keyless
# auth, because the registry trusts only the literal gitlab.com issuer. Create
# a bot token in the portal under Settings → Tokens and set its Client ID and
# Client Secret as the masked CI/CD variables TERRAMANTLE_CLIENT_ID and
# TERRAMANTLE_CLIENT_SECRET. No VCS trust entry is needed for this grant.
#
# Required CI/CD variables:
#   GITHUB_TOKEN    (masked) — tflint plugin downloads; without it the job shares
#                   one anonymous 60/hr GitHub API quota by runner IP.

stages: [check, plan, apply, publish]

workflow:
  # Only jobs marked interruptible are auto-cancelled; apply and publish are
  # interruptible: false, so an in-flight apply is never killed by a new push.
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # Avoid duplicate branch + MR pipelines for the same commit.
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web"
    - when: never

variables:
  TERRAMANTLE_ORG: "acme-demo"
  TERRAMANTLE_API_URL: "https://registry.terramantle.dev"

  TOFU_VERSION: "1.13.2"
  TERRAMATE_VERSION: "0.17.3"
  TERRAMANTLE_CLI_VERSION: "0.10.1"
  TFLINT_VERSION: "0.65.0"

  # Bootstrap escape hatch. On a brand-new repo `--changed` has nothing to diff
  # against and would select no stacks at all; run a manual pipeline on
  # main with this set to "true" for the first apply.
  # Set to "1" to always select every stack (manifest ci.change_base = all).
  TM_CHANGE_BASE_ALL: "0"

  TM_ALL_STACKS:
    value: "false"
    options: ["false", "true"]
    description: "Bootstrap: select EVERY stack instead of only changed ones."

  # Terramate change detection needs full history and real remote refs.
  GIT_STRATEGY: clone
  GIT_DEPTH: "0"
  GIT_SUBMODULE_STRATEGY: none

  # The state backend ignores the Basic username and reads the token from the
  # password. `auth env --terraform` sets TF_HTTP_PASSWORD but NOT
  # TF_HTTP_USERNAME, and OpenTofu only sends the Authorization header when a
  # username is present.
  TF_HTTP_USERNAME: "terramantle-ci"
  # Set as variables rather than flags: `tofu apply <savedplan>` rejects extra
  # planning options but honours these.
  TF_IN_AUTOMATION: "1"
  TF_INPUT: "0"
  DEBIAN_FRONTEND: noninteractive

# ── reusable fragments ───────────────────────────────────────────────────────
# `extends:` with hidden jobs, not YAML anchors: GitLab documents extends as the
# recommended mechanism and it deep-merges, which anchors do not.

# auth=bot: a portal-created bot token, supplied as masked CI/CD variables
# (TERRAMANTLE_CLIENT_ID / TERRAMANTLE_CLIENT_SECRET on the project).
# The explicit mode stops detection falling through to GitLab OIDC.
.ci_auth:
  variables:
    TERRAMANTLE_AUTH_MODE: client

.tools:
  image: debian:stable-slim
  before_script:
    - set -eu
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends ca-certificates curl git jq tar gzip unzip coreutils
    - |
      # --- OpenTofu (pinned + checksum verified) ------------------------------
      cd /tmp
      curl --proto '=https' --tlsv1.2 -fsSLO \
        "https://github.com/opentofu/opentofu/releases/download/v${TOFU_VERSION}/tofu_${TOFU_VERSION}_linux_amd64.zip"
      curl --proto '=https' --tlsv1.2 -fsSLO \
        "https://github.com/opentofu/opentofu/releases/download/v${TOFU_VERSION}/tofu_${TOFU_VERSION}_SHA256SUMS"
      grep -F "tofu_${TOFU_VERSION}_linux_amd64.zip" "tofu_${TOFU_VERSION}_SHA256SUMS" > tofu.sha256
      sha256sum -c tofu.sha256
      unzip -oq "tofu_${TOFU_VERSION}_linux_amd64.zip" tofu -d /usr/local/bin
      chmod +x /usr/local/bin/tofu
      tofu version
    - |
      # --- Terramate (pinned + checksum verified) -----------------------------
      # There is no official GitLab component; install from the release tarball.
      cd /tmp
      curl --proto '=https' --tlsv1.2 -fsSLO \
        "https://github.com/terramate-io/terramate/releases/download/v${TERRAMATE_VERSION}/terramate_${TERRAMATE_VERSION}_linux_x86_64.tar.gz"
      curl --proto '=https' --tlsv1.2 -fsSLO \
        "https://github.com/terramate-io/terramate/releases/download/v${TERRAMATE_VERSION}/checksums.txt"
      grep -F "terramate_${TERRAMATE_VERSION}_linux_x86_64.tar.gz" checksums.txt > tm.sha256
      sha256sum -c tm.sha256
      tar -xzf "terramate_${TERRAMATE_VERSION}_linux_x86_64.tar.gz" -C /usr/local/bin terramate
      chmod +x /usr/local/bin/terramate
      terramate version | grep -qxF "${TERRAMATE_VERSION}"
    - |
      # --- Terramantle CLI (pinned release) -----------------------------------
      curl --proto '=https' --tlsv1.2 -LsSf \
        "https://github.com/terramantle/terramantle-cli/releases/download/v${TERRAMANTLE_CLI_VERSION}/cli-installer.sh" | sh
      install -m 0755 "$HOME/.cargo/bin/terramantle" /usr/local/bin/terramantle
      terramantle --version
    - cd "$CI_PROJECT_DIR"
    - git config --global --add safe.directory "$CI_PROJECT_DIR"

# Resolves TM_ALL and TM_BASE. Every script fragment in a job runs in ONE shell,
# so these are visible to the fragments that follow.
.changebase:
  script:
    - |
      set -eu
      if [ "${TM_ALL_STACKS:-false}" = "true" ] || [ "${TM_CHANGE_BASE_ALL:-0}" = "1" ]; then
        TM_ALL=1; TM_BASE=""
        echo "every stack selected (bootstrap or change_base=all)"
      else
        TM_ALL=0
        TM_TARGET="${CI_MERGE_REQUEST_TARGET_BRANCH_NAME:-$CI_DEFAULT_BRANCH}"
        git fetch --no-tags origin "+refs/heads/${TM_TARGET}:refs/remotes/origin/${TM_TARGET}"
        if [ "${CI_COMMIT_BRANCH:-}" = "${CI_DEFAULT_BRANCH}" ]; then
          if ! git rev-parse --verify "HEAD^" >/dev/null 2>&1; then
            echo "ERROR: HEAD has no parent commit, so there is nothing to diff against."
            echo "ERROR: run a manual pipeline on ${CI_DEFAULT_BRANCH} with TM_ALL_STACKS=true to bootstrap."
            exit 1
          fi
          TM_BASE="$(git rev-parse HEAD^)"
        else
          if ! git rev-parse --verify "origin/${TM_TARGET}" >/dev/null 2>&1; then
            echo "ERROR: origin/${TM_TARGET} is missing — GIT_STRATEGY must be clone and GIT_DEPTH 0."
            exit 1
          fi
          # merge-base, not the branch tip: correct under squash and rebase too.
          TM_BASE="$(git merge-base "origin/${TM_TARGET}" HEAD)"
        fi
        echo "change base: $TM_BASE"
      fi
      export TM_ALL TM_BASE

.auth:
  script:
    - |
      set -eu
      eval "$(terramantle auth env --terraform)"
      for v in TF_HTTP_PASSWORD TF_TOKEN_registry_terramantle_dev TF_TOKEN_acme__demo_registry_terramantle_dev; do
        eval "val=\${$v:-}"
        if [ -z "$val" ]; then
          echo "ERROR: $v was not exported by 'terramantle auth env --terraform'."
          echo "ERROR: check TERRAMANTLE_ORG is set and CI auth is configured (see the file header)."
          exit 1
        fi
      done

# ── 1. drift gate, formatting, lint ──────────────────────────────────────────
check:
  stage: check
  extends: [.tools]     # deliberately not .ci_auth — this job needs no identity
  interruptible: true
  timeout: 20m
  script:
    - |
      set -u
      # `terramate fmt` has no --check; --detailed-exit-code returns 2 when it
      # reformatted something, which is the CI failure condition.
      terramate fmt --detailed-exit-code
      rc=$?
      if [ "$rc" = "2" ]; then
        echo "ERROR: terramate files are not formatted — run 'terramate fmt' and commit."
        git --no-pager diff --stat; exit 1
      elif [ "$rc" != "0" ]; then exit "$rc"; fi
      echo "terramate files are formatted"
    - |
      set -u
      terramate generate --detailed-exit-code
      rc=$?
      if [ "$rc" = "2" ]; then
        echo "ERROR: 'terramate generate' produced changes — run it locally and commit the result."
        git --no-pager diff --stat; exit 1
      elif [ "$rc" != "0" ]; then exit "$rc"; fi
      echo "generated code is up to date"
    - tofu fmt -check -recursive -no-color .
    - |
      set -eu
      if [ -z "${GITHUB_TOKEN:-}" ]; then
        echo "ERROR: CI/CD variable GITHUB_TOKEN is not set."
        echo "ERROR: 'tflint --init' downloads plugins from the GitHub API and will hit the"
        echo "ERROR: 60/hr anonymous shared-IP rate limit. Add a masked GITHUB_TOKEN variable"
        echo "ERROR: (a classic PAT with NO scopes is sufficient)."
        exit 1
      fi
      test -f "$CI_PROJECT_DIR/.tflint.hcl" || { echo "ERROR: .tflint.hcl missing at the repo root"; exit 1; }
      cd /tmp
      curl --proto '=https' --tlsv1.2 -fsSLO \
        "https://github.com/terraform-linters/tflint/releases/download/v${TFLINT_VERSION}/tflint_linux_amd64.zip"
      curl --proto '=https' --tlsv1.2 -fsSLO \
        "https://github.com/terraform-linters/tflint/releases/download/v${TFLINT_VERSION}/checksums.txt"
      grep -F "tflint_linux_amd64.zip" checksums.txt > tflint.sha256
      sha256sum -c tflint.sha256
      unzip -oq tflint_linux_amd64.zip -d /usr/local/bin
      chmod +x /usr/local/bin/tflint
      cd "$CI_PROJECT_DIR"
      tflint --version
    # `--recursive --init` in that order; a bare `--init` only does the root.
    - tflint --recursive --init --config "$CI_PROJECT_DIR/.tflint.hcl"
    - tflint --recursive --config "$CI_PROJECT_DIR/.tflint.hcl" --format compact

# ── 2. plan every selected stack and push each to the policy gate ────────────
plan:
  stage: plan
  extends: [.tools, .ci_auth]
  interruptible: true
  timeout: 45m
  needs: ["check"]
  script:
    - !reference [.changebase, script]
    - !reference [.auth, script]
    - |
      set -eu
      mkdir -p "$CI_PROJECT_DIR/.terramantle-ci"
      if [ "$TM_ALL" = "1" ]; then
        terramate list > "$CI_PROJECT_DIR/.terramantle-ci/stacks.txt"
      else
        terramate list --changed --git-change-base "$TM_BASE" > "$CI_PROJECT_DIR/.terramantle-ci/stacks.txt"
      fi
      count="$(grep -c . "$CI_PROJECT_DIR/.terramantle-ci/stacks.txt" || true)"
      echo "=== stacks selected: $count (base ${TM_BASE:-<all>}) ==="
      cat "$CI_PROJECT_DIR/.terramantle-ci/stacks.txt"
      if [ "$count" = "0" ]; then
        echo "NOTICE: no stacks selected — nothing will be planned or applied."
        echo "NOTICE: on a new repo, run a manual pipeline with TM_ALL_STACKS=true."
      fi
    - |
      set -eu
      : > "$CI_PROJECT_DIR/.terramantle-ci/plans.tsv"
      : > "$CI_PROJECT_DIR/.terramantle-ci/summary.md"
      echo '[]' > /tmp/counts.json

      # Which plans are these? Only a plan made on the default branch is pushed
      # WITHOUT a ref and so gates the workspace. Everything else carries one
      # and gets a verdict only - including a manual pipeline on some other
      # branch, which must not be able to block or unblock the workspace.
      if [ -n "${CI_MERGE_REQUEST_IID:-}" ]; then
        TM_PLAN_REF="mr-${CI_MERGE_REQUEST_IID}"
      elif [ "${CI_COMMIT_BRANCH:-}" != "${CI_DEFAULT_BRANCH}" ]; then
        TM_PLAN_REF="branch-${CI_COMMIT_REF_SLUG}"
      else
        TM_PLAN_REF=""
      fi
      blocked=0
      while IFS= read -r dir; do
        dir="${dir#./}"
        [ -n "$dir" ] || continue
        echo "==> planning $dir"
        (
          cd "$dir"
          tofu init -input=false -no-color
          tofu validate -no-color
          # The plan takes the state LOCK, and the server grants a plan a
          # READ-ONLY one. Two gates meet it differently. A STATE-policy block
          # refuses it, here, at review time - which is why -lock=false is not
          # used. A PLAN block does not: planning has to work on a blocked
          # workspace, because a passing plan is what lifts the block.
          tofu plan -input=false -lock-timeout=300s -no-color -out=tfplan
          test -s tfplan || { echo "ERROR: tofu produced no plan file in $dir"; exit 1; }
          # The plan JSON holds cleartext values: it stays in /tmp and is deleted.
          tofu show -json tfplan > /tmp/plan.json
        )

        # Push the plan to the policy gate. `plan push` renders the plan itself
        # (so the render is of this exact file), checks it was made from the
        # workspace's current state before uploading, and prints the verdict.
        # Exit 3 = the gate blocked it; 7 = the state moved since the plan was
        # made, so retry the job to re-plan.
        rc=0
        if [ -n "$TM_PLAN_REF" ]; then
          terramantle plan push tfplan --chdir "$dir" --ref "$TM_PLAN_REF" || rc=$?
        else
          terramantle plan push tfplan --chdir "$dir" || rc=$?
        fi
        case "$rc" in
          0) ;;
          3)
            # Carry on to the remaining stacks so every verdict is in the log,
            # and decide what a block means once they have all been pushed.
            blocked=$((blocked + 1))
            echo "BLOCKED: the plan gate blocked the plan for $dir" ;;
          *) exit "$rc" ;;
        esac
        # What the apply job pins its pull to: this commit, and the sha-256 of
        # this exact plan file. A digest reveals nothing in the plan.
        printf '%s\t%s\t%s\n' "$CI_COMMIT_SHA" "$(sha256sum "$dir/tfplan" | cut -d' ' -f1)" "$dir" \
          >> "$CI_PROJECT_DIR/.terramantle-ci/plans.tsv"
        c=$(jq '[.resource_changes[]? | select(.change.actions|index("create"))]|length' /tmp/plan.json)
        u=$(jq '[.resource_changes[]? | select(.change.actions|index("update"))]|length' /tmp/plan.json)
        d=$(jq '[.resource_changes[]? | select(.change.actions|index("delete"))]|length' /tmp/plan.json)
        {
          echo "#### $dir"
          echo "create: $c · update: $u · destroy: $d"
          jq -r '.resource_changes[]? | select(.change.actions != ["no-op"])
                 | "  - " + (.change.actions|join("+")) + " " + .address' /tmp/plan.json
          echo
        } >> "$CI_PROJECT_DIR/.terramantle-ci/summary.md"
        jq --argjson c "$c" --argjson u "$u" --argjson d "$d" \
           '. + [{create:$c, update:$u, delete:$d}]' /tmp/counts.json > /tmp/counts.next
        mv /tmp/counts.next /tmp/counts.json
        rm -f /tmp/plan.json
      done < "$CI_PROJECT_DIR/.terramantle-ci/stacks.txt"
      echo "=== plan summary ==="
      cat "$CI_PROJECT_DIR/.terramantle-ci/summary.md"

      if [ "$blocked" != "0" ]; then
        if [ -n "$TM_PLAN_REF" ]; then
          # A blocked merge-request plan fails the job. The workspaces
          # themselves are untouched.
          echo "ERROR: the plan gate blocked $blocked plan(s) for $TM_PLAN_REF — see the verdicts above."
          exit 3
        fi
        # On the default branch the job does NOT fail here, on purpose. The
        # workspace is now blocked and the apply job's pull will be refused,
        # which is where this pipeline stops. Once someone approves the plan
        # (`terramantle plan approve`, or the portal), retrying the apply job
        # applies THIS plan. Failing here instead would make a retry plan
        # again, and the new plan would need a new approval.
        echo "WARNING: the plan gate blocked $blocked plan(s): the apply will be refused until each is approved or a passing plan is pushed."
      fi
  artifacts:
    name: "terramantle-plans-$CI_PIPELINE_ID"
    # No plan file is in here: only the stack list, each plan's digest, and a
    # summary of counts and resource addresses. Still nothing a public
    # project's visitors need, so access stays restricted. `access` and
    # `public` are mutually exclusive, so only `access` is set.
    access: 'developer'
    expire_in: 1 day
    when: on_success
    paths:
      - .terramantle-ci/plans.tsv
      - .terramantle-ci/stacks.txt
      - .terramantle-ci/summary.md

# ── 3. pull the gated plans and apply them (default branch only) ─────────────
apply:
  stage: apply
  extends: [.tools, .ci_auth]
  interruptible: false
  resource_group: terramantle-apply-$CI_COMMIT_REF_SLUG
  timeout: 90m
  needs:
    - job: plan
      artifacts: true
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - when: never
  script:
    - !reference [.changebase, script]
    - |
      set -eu
      cd "$CI_PROJECT_DIR"
      test -f .terramantle-ci/plans.tsv || { echo "ERROR: plan digests missing from the plan job's artifacts"; exit 1; }

      expected="$(grep -c . .terramantle-ci/stacks.txt || true)"
      if [ "$expected" = "0" ]; then
        echo "NOTICE: no stacks were selected at plan time — nothing to apply."
        exit 0
      fi
      recorded="$(grep -c . .terramantle-ci/plans.tsv || true)"
      if [ "$recorded" != "$expected" ]; then
        echo "ERROR: expected $expected plan digests, found $recorded — refusing to apply a partial change set"
        exit 1
      fi

      # Every plan is pulled BEFORE anything is applied, so one refused plan
      # stops the whole change set rather than half of it.
      TAB="$(printf '\t')"
      pulled=0
      while IFS="$TAB" read -r commit sha dir; do
        [ -n "$dir" ] || continue
        # A plan built from another commit would apply something never reviewed.
        if [ "$commit" != "$CI_COMMIT_SHA" ]; then
          echo "ERROR: plan for $dir was built from $commit, not $CI_COMMIT_SHA"; exit 1
        fi
        # The workspace's gating plan, and only if it is byte-for-byte the one
        # the plan job made (--expect-sha). The server refuses it when it is
        # blocked and unapproved (exit 3: approve it, then retry this job) or
        # when the state has moved since it was planned (exit 7: run a new
        # pipeline to plan again). On a refusal or a mismatch no plan is
        # written, so there is nothing to apply.
        terramantle plan pull --chdir "$dir" --out tfplan --expect-sha "$sha"
        pulled=$((pulled + 1))
      done < .terramantle-ci/plans.tsv
      echo "pulled $pulled plan(s) for commit $CI_COMMIT_SHA"
    - !reference [.auth, script]
    - |
      set -eu
      # `terramate run` honours each stack's before/after ordering. A pulled
      # plan carries no .terraform/ directory, so every stack re-inits here
      # against its committed .terraform.lock.hcl and the identical tofu pin.
      #
      # tfplan and .terramantle-ci must be gitignored or Terramate's
      # git-untracked safeguard aborts before the first stack.
      if [ "$TM_ALL" = "1" ]; then
        terramate run -- tofu init -input=false -no-color
        terramate run -- tofu apply -input=false -lock-timeout=300s -no-color tfplan
      else
        terramate run --changed --git-change-base "$TM_BASE" -- tofu init -input=false -no-color
        terramate run --changed --git-change-base "$TM_BASE" -- tofu apply -input=false -lock-timeout=300s -no-color tfplan
      fi
      # No -auto-approve: it is ignored when a saved plan is supplied, since
      # passing the plan file IS the approval.

# ── 4. publish lock files + posture gate ─────────────────────────────────────
publish:
  stage: publish
  extends: [.tools, .ci_auth]
  interruptible: false
  resource_group: terramantle-publish-$CI_COMMIT_REF_SLUG
  timeout: 20m
  needs:
    - job: apply
      artifacts: false
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - when: never
  script:
    - |
      set -eu
      # `state publish` skips a directory without a .terraform.lock.hcl. Make
      # that loud rather than a silently short publish.
      missing=0
      terramate list > /tmp/all-stacks.txt
      while IFS= read -r dir; do
        dir="${dir#./}"
        [ -n "$dir" ] || continue
        if [ ! -f "$dir/.terraform.lock.hcl" ]; then
          echo "ERROR: $dir has no committed .terraform.lock.hcl — state publish would skip it"
          missing=1
        fi
      done < /tmp/all-stacks.txt
      [ "$missing" -eq 0 ]
    # Exit 3 means the posture gate tripped on an at-risk provider.
    - terramantle state publish --ci --fail-on-atrisk
