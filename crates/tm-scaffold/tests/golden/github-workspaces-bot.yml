# managed by terramantle · template=github/workspaces · v=3
# Generated by `terramantle init`; re-rendered by `terramantle upgrade`.
# Edits are overwritten — change terramantle.hcl and re-run `upgrade` instead.
#
# Emitted by `terramantle init` for artefact=workspaces (states) · vcs=github.
# Terramate stacks + OpenTofu + the Terramantle HTTP state backend.
#
# Shape: every plan goes to Terramantle's plan gate, and what it means depends
# on where it was made.
#
#   * A pull request plans every changed stack and pushes each plan with
#     `--ref pr-<number>`. The gate's verdict passes or fails the check. A plan
#     with a ref NEVER blocks or unblocks the workspace: a failing pull request
#     must not stop an unrelated apply on main.
#   * main plans again, against the state as it is now, and pushes
#     with NO ref. That plan gates the workspace: blocked, the apply is refused
#     (planning still works) until a passing plan is pushed or it is approved.
#   * The apply job pulls that plan back from Terramantle, pinned to the
#     sha-256 the plan job recorded, and applies exactly those bytes.
#
# The plan file never becomes a CI artifact. It holds the full configuration
# and every value in cleartext, so it is stored where the state is, behind the
# same access: pulling one needs write access to the workspace's state. Only
# its digest travels between jobs.
#
# Auth uses a BOT TOKEN, not OIDC. Create one in the portal under Settings →
# Tokens, then set its Client ID and Client Secret as the repo secrets
# TERRAMANTLE_CLIENT_ID and TERRAMANTLE_CLIENT_SECRET (Settings → Secrets and
# variables → Actions). No VCS trust entry is needed: the token carries its
# own identity rather than borrowing the repo's.
name: terramantle

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      all_stacks:
        description: "Bootstrap: select EVERY stack instead of only changed ones. Use on a new repo with no prior commit to diff against."
        type: boolean
        required: false
        default: false

# Least privilege: nothing by default, each job opts in to exactly what it needs.
permissions: {}

# An in-flight apply is never cancelled — a half-applied stack would leave a
# stale lock on the backend. Only PR runs are cancellable.
concurrency:
  group: terramantle-main-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  TERRAMANTLE_ORG: "acme-demo"
  TERRAMANTLE_API_URL: "https://registry.terramantle.dev"
  # The state backend ignores the Basic username and reads the token from the
  # password. `auth env --terraform` sets TF_HTTP_PASSWORD but NOT
  # TF_HTTP_USERNAME, and OpenTofu only sends the Authorization header when a
  # username is present — so it is pinned here.
  TF_HTTP_USERNAME: "terramantle-ci"
  # Set as env rather than flags: `tofu apply <savedplan>` rejects additional
  # planning options, but honours these.
  TF_IN_AUTOMATION: "1"
  TF_INPUT: "0"
  # auth=bot: a portal-created bot token. The explicit auth mode stops
  # detection falling through to the ambient GitHub OIDC token.
  TERRAMANTLE_AUTH_MODE: client
  TERRAMANTLE_CLIENT_ID: ${{ secrets.TERRAMANTLE_CLIENT_ID }}
  TERRAMANTLE_CLIENT_SECRET: ${{ secrets.TERRAMANTLE_CLIENT_SECRET }}
  # "1" always selects every stack (manifest ci.change_base = all).
  TM_CHANGE_BASE_ALL: "0"

jobs:
  # ── 1. drift gate + change detection ───────────────────────────────────────
  discover:
    name: discover
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      stacks: ${{ steps.list.outputs.stacks }}
      count: ${{ steps.list.outputs.count }}
      base: ${{ steps.base.outputs.base }}
      all: ${{ steps.base.outputs.all }}
    steps:
      - name: Checkout (full history — Terramate change detection needs it)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Terramate
        uses: terramate-io/terramate-action@1cc78a548efefaab7762f4d06f51aa6de06ce201 # v3.3.0
        with:
          # Required: action v3 no longer falls back to latest and exits 1 with
          # neither `version:` nor a committed .tool-versions.
          version: "0.17.3"

      - name: Verify the pinned Terramate is what we got
        run: |
          terramate version
          terramate version | grep -qxF "0.17.3"

      - name: Resolve change base
        id: base
        env:
          EVENT: ${{ github.event_name }}
          ALL_INPUT: ${{ github.event.inputs.all_stacks }}
          PR_BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          all=0
          base=""

          if [ "${ALL_INPUT:-false}" = "true" ] || [ "${TM_CHANGE_BASE_ALL:-0}" = "1" ]; then
            all=1
            echo "::notice::every stack selected (bootstrap or change_base=all)"
          elif [ "$EVENT" = "pull_request" ]; then
            git rev-parse --verify "origin/${PR_BASE_REF}" >/dev/null 2>&1 || {
              echo "::error::origin/${PR_BASE_REF} is missing — checkout needs fetch-depth: 0"; exit 1; }
            # merge-base, not the branch tip: correct under squash and rebase merges too.
            base="$(git merge-base "origin/${PR_BASE_REF}" HEAD)"
          elif [ "$GITHUB_REF_NAME" = "main" ]; then
            git rev-parse --verify "HEAD^" >/dev/null 2>&1 || {
              echo "::error::HEAD has no parent commit, so there is nothing to diff against."
              echo "::error::Run this workflow from the Actions tab with all_stacks=true to bootstrap."
              exit 1; }
            base="$(git rev-parse HEAD^)"
          else
            git rev-parse --verify "origin/main" >/dev/null 2>&1 || {
              echo "::error::origin/main is missing — checkout needs fetch-depth: 0"; exit 1; }
            base="$(git merge-base "origin/main" HEAD)"
          fi

          echo "all=$all" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "change base: ${base:-<all stacks>}"

      - name: Generated code is up to date
        run: |
          set -uo pipefail
          # `terramate generate` rewrites the committed _backend.tf files in
          # place; --detailed-exit-code returns 2 when it had to change anything,
          # which means the commit is missing a `terramate generate` run.
          terramate generate --detailed-exit-code
          rc=$?
          case "$rc" in
            0) echo "generated code is up to date" ;;
            2) echo "::error::\`terramate generate\` produced changes — run it locally and commit the result."
               git --no-pager diff --stat
               exit 1 ;;
            *) exit "$rc" ;;
          esac

      - name: Select stacks
        id: list
        env:
          ALL: ${{ steps.base.outputs.all }}
          BASE: ${{ steps.base.outputs.base }}
        run: |
          set -euo pipefail
          if [ "$ALL" = "1" ]; then
            terramate list > "$RUNNER_TEMP/stacks.txt"
          else
            terramate list --changed --git-change-base "$BASE" > "$RUNNER_TEMP/stacks.txt"
          fi

          json='[]'
          while IFS= read -r dir; do
            dir="${dir#./}"
            [ -n "$dir" ] || continue
            # An artifact name cannot contain / \ : < > | * ? " and must be
            # unique. Sanitised path + a hash of the ORIGINAL path, so two
            # distinct stacks can never collide once sanitised.
            slug="$(printf '%s' "$dir" | tr -c 'A-Za-z0-9._-' '-')-$(printf '%s' "$dir" | sha256sum | cut -c1-8)"
            json="$(printf '%s' "$json" | jq -c --arg d "$dir" --arg s "$slug" '. + [{dir:$d, slug:$s}]')"
          done < "$RUNNER_TEMP/stacks.txt"

          count="$(printf '%s' "$json" | jq 'length')"
          { echo "stacks=$json"; echo "count=$count"; } >> "$GITHUB_OUTPUT"

          { echo "## Terramantle"; echo; echo "**Stacks selected: ${count}**"; echo; } >> "$GITHUB_STEP_SUMMARY"
          if [ "$count" = "0" ]; then
            # Explicit, never silent: this is the "--changed matched nothing" case.
            echo "_No stacks selected — nothing will be planned or applied._" >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::0 stacks selected. On a new repo, re-run with all_stacks=true."
          else
            printf '%s' "$json" | jq -r '.[] | "- `\(.dir)`"' >> "$GITHUB_STEP_SUMMARY"
          fi

  # ── 2. repo-wide formatting and lint ───────────────────────────────────────
  checks:
    name: fmt / lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: terramate-io/terramate-action@1cc78a548efefaab7762f4d06f51aa6de06ce201 # v3.3.0
        with:
          version: "0.17.3"

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: "1.13.2"
          # The wrapper re-exports stdout/stderr as step outputs and swallows
          # exit codes; every call here is scripted, so turn it off.
          tofu_wrapper: false

      - name: terramate fmt
        run: |
          set -uo pipefail
          # `terramate fmt` has no --check; --detailed-exit-code returns 2 when
          # it reformatted something, which is the CI failure condition.
          terramate fmt --detailed-exit-code
          rc=$?
          case "$rc" in
            0) echo "terramate files are formatted" ;;
            2) echo "::error::terramate files are not formatted — run \`terramate fmt\` and commit."
               git --no-pager diff --stat
               exit 1 ;;
            *) exit "$rc" ;;
          esac

      - name: tofu fmt
        run: tofu fmt -check -recursive -no-color .

      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: "v0.65.0"

      - name: tflint plugin init
        env:
          # Plugin install hits the GitHub API. Without a token the runner
          # shares one anonymous 60/hr quota by IP and fails intermittently.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test -f "$(pwd)/.tflint.hcl" || { echo "::error::.tflint.hcl is missing at the repo root"; exit 1; }
          # setup-tflint does NOT init for you, and `--recursive --init` in that
          # order is what installs plugins for every stack — a bare `--init`
          # only initialises the root directory.
          tflint --recursive --init --config "$(pwd)/.tflint.hcl"

      - name: tflint
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # In recursive mode a relative --config is resolved per directory, so
        # the single repo-root config must be passed as an absolute path.
        run: tflint --recursive --config "$(pwd)/.tflint.hcl" --format compact

  # ── 3. plan each selected stack and push it to the policy gate ─────────────
  plan:
    name: plan ${{ matrix.dir }}
    needs: [discover, checks]
    # Two guards. An empty matrix vector is a hard error on GitHub, so never
    # expand one. And a fork PR gets a read-only token that cannot mint OIDC, so
    # skip visibly rather than failing deep inside auth.
    if: >-
      needs.discover.outputs.count != '0'
      && (github.event_name != 'pull_request'
          || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.stacks) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: "1.13.2"
          tofu_wrapper: false

      - name: Install the Terramantle CLI
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -LsSf \
            "https://github.com/terramantle/terramantle-cli/releases/download/v0.11.0/cli-installer.sh" | sh
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Init, validate, plan
        env:
          STACK_DIR: ${{ matrix.dir }}
        run: |
          set -euo pipefail

          # Must run in the SAME shell as tofu — exports do not cross steps.
          eval "$(terramantle auth env --terraform)"

          # Fail loudly if a credential did not materialise. Without the org
          # TF_TOKEN the provider download silently falls back to anonymous and
          # dies much later with an opaque 401.
          for v in TF_HTTP_PASSWORD TF_TOKEN_registry_terramantle_dev TF_TOKEN_acme__demo_registry_terramantle_dev; do
            eval "val=\${$v:-}"
            [ -n "$val" ] || {
              echo "::error::$v was not exported by 'terramantle auth env --terraform' (is TERRAMANTLE_ORG set?)"
              exit 1; }
          done
          echo "::add-mask::$TF_HTTP_PASSWORD"

          cd "$STACK_DIR"
          tofu init -input=false -no-color
          tofu validate -no-color
          # The plan takes the state LOCK, and the server grants a plan a
          # READ-ONLY one. Two gates meet it differently. A STATE-policy block
          # refuses it, here, at review time - which is why -lock=false is not
          # used. A PLAN block does not: planning has to work on a blocked
          # workspace, because a passing plan is what lifts the block.
          tofu plan -input=false -lock-timeout=300s -no-color -out=tfplan
          test -s tfplan || { echo "::error::tofu produced no plan file"; exit 1; }

      - name: Summarise the plan
        env:
          STACK_DIR: ${{ matrix.dir }}
          SLUG: ${{ matrix.slug }}
        run: |
          set -euo pipefail
          # The plan JSON holds cleartext values. It stays on the runner and is
          # deleted in this step; only counts and resource addresses escape.
          tofu -chdir="$STACK_DIR" show -json tfplan > "$RUNNER_TEMP/plan.json"
          c=$(jq '[.resource_changes[]? | select(.change.actions|index("create"))]|length' "$RUNNER_TEMP/plan.json")
          u=$(jq '[.resource_changes[]? | select(.change.actions|index("update"))]|length' "$RUNNER_TEMP/plan.json")
          d=$(jq '[.resource_changes[]? | select(.change.actions|index("delete"))]|length' "$RUNNER_TEMP/plan.json")
          {
            echo "#### \`$STACK_DIR\`"
            echo
            echo "| create | update | destroy |"
            echo "|---:|---:|---:|"
            echo "| $c | $u | $d |"
            echo
            if [ "$((c + u + d))" -eq 0 ]; then
              echo "_No changes._"
            else
              echo "<details><summary>Resource changes</summary>"
              echo
              jq -r '.resource_changes[]? | select(.change.actions != ["no-op"])
                     | "- `" + (.change.actions|join("+")) + "` " + .address' "$RUNNER_TEMP/plan.json"
              echo
              echo "</details>"
            fi
            echo
          } > "$RUNNER_TEMP/summary-$SLUG.md"
          rm -f "$RUNNER_TEMP/plan.json"
          cat "$RUNNER_TEMP/summary-$SLUG.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Push the plan to the policy gate
        env:
          STACK_DIR: ${{ matrix.dir }}
          SLUG: ${{ matrix.slug }}
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          cd "$STACK_DIR"

          # Which plan is this? Only a plan made on main is pushed
          # WITHOUT a ref and so gates the workspace. Everything else carries
          # one and gets a verdict only - including a manual run on some other
          # branch, which must not be able to block or unblock the workspace.
          if [ "$EVENT" = "pull_request" ]; then
            ref="pr-${PR_NUMBER}"
          elif [ "$GITHUB_REF" != "refs/heads/main" ]; then
            ref="branch-$(printf '%s' "$GITHUB_REF_NAME" | tr -c 'A-Za-z0-9._-' '-')"
          else
            ref=""
          fi

          # `plan push` renders the plan itself (so the render is of this exact
          # file), checks it was made from the workspace's current state before
          # uploading, and prints the verdict. Exit 3 = the gate blocked it;
          # 7 = the state moved since the plan was made, so re-run to re-plan.
          rc=0
          if [ -n "$ref" ]; then
            terramantle plan push tfplan --ref "$ref" 2>&1 | tee "$RUNNER_TEMP/verdict-$SLUG.txt" || rc=$?
          else
            terramantle plan push tfplan 2>&1 | tee "$RUNNER_TEMP/verdict-$SLUG.txt" || rc=$?
          fi

          # The verdict lines are the gate's own reasons - never a plan value.
          {
            echo "<details><summary>Policy gate for <code>$STACK_DIR</code> (exit $rc)</summary>"
            echo
            echo '```'
            cat "$RUNNER_TEMP/verdict-$SLUG.txt"
            echo '```'
            echo
            echo "</details>"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          case "$rc" in
            0) ;;
            3)
              if [ -n "$ref" ]; then
                # A blocked pull-request plan fails the check. The workspace
                # itself is untouched.
                echo "::error::the plan gate blocked the plan for $STACK_DIR ($ref)"
                exit 3
              fi
              # On main the job does NOT fail here, on purpose.
              # The workspace is now blocked and the apply job's pull will be
              # refused, which is where this run stops. Once someone approves
              # the plan (`terramantle plan approve`, or the portal), re-running
              # the failed apply job applies THIS plan. Failing here instead
              # would make a re-run plan again, and the new plan would need a
              # new approval.
              echo "::warning::the plan gate blocked the plan for $STACK_DIR: the apply will be refused until this plan is approved or a passing plan is pushed"
              ;;
            *) exit "$rc" ;;
          esac

          # What the apply job pins its pull to: this commit, and the sha-256
          # of this exact plan file. A digest reveals nothing in the plan.
          mkdir -p "$RUNNER_TEMP/digest"
          printf '%s\t%s\n' "$GITHUB_SHA" "$(sha256sum tfplan | cut -d' ' -f1)" \
            > "$RUNNER_TEMP/digest/$SLUG.digest"

      - name: Hand the plan's digest to the apply job
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # Deterministic name (no run_id / run_attempt) so re-running only the
          # apply job still finds it. Artifacts are immutable since v4, hence
          # overwrite for a full re-run.
          name: tfplan-sha-${{ matrix.slug }}
          path: ${{ runner.temp }}/digest/${{ matrix.slug }}.digest
          retention-days: 1
          if-no-files-found: error
          overwrite: true

      - name: Upload the plan summary
        # Counts and resource addresses only — no values. The plan itself is
        # never an artifact: it goes to Terramantle, so the comment job has
        # nothing cleartext to download.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plansummary-${{ matrix.slug }}
          path: ${{ runner.temp }}/summary-${{ matrix.slug }}.md
          retention-days: 1
          if-no-files-found: error
          overwrite: true


  # ── 3b. sticky PR comment ──────────────────────────────────────────────────
  pr_comment:
    name: PR plan comment
    needs: [discover, plan]
    if: >-
      github.event_name == 'pull_request'
      && needs.discover.outputs.count != '0'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pull-requests: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          # Only the summaries (counts and addresses). The plans themselves are
          # in Terramantle, not in an artifact, so nothing cleartext can reach
          # a comment body from here.
          pattern: plansummary-*
          merge-multiple: true
          path: ${{ runner.temp }}/summaries

      - name: Build the comment body
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=("$RUNNER_TEMP"/summaries/summary-*.md)
          [ "${#files[@]}" -gt 0 ] || { echo "::error::no plan summaries were downloaded"; exit 1; }
          {
            echo "<!-- terramantle-plan -->"
            echo "## Terramantle plan — \`${GITHUB_SHA:0:7}\`"
            echo
            cat "${files[@]}"
          } > "$RUNNER_TEMP/body.md"
          # A GitHub comment caps at 65536 characters.
          if [ "$(wc -c < "$RUNNER_TEMP/body.md")" -gt 60000 ]; then
            head -c 60000 "$RUNNER_TEMP/body.md" > "$RUNNER_TEMP/body.trunc.md"
            printf '\n\n_Truncated — see the workflow run summary for the full plan._\n' >> "$RUNNER_TEMP/body.trunc.md"
            mv "$RUNNER_TEMP/body.trunc.md" "$RUNNER_TEMP/body.md"
          fi

      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync(`${process.env.RUNNER_TEMP}/body.md`, 'utf8');
            const marker = '<!-- terramantle-plan -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            // Update in place so a busy PR gets one comment, not one per push.
            const comments = await github.paginate(
              github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  # ── 4. pull the gated plans and apply them (default branch only) ───────────
  apply:
    name: apply
    needs: [discover, plan]
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && github.ref == 'refs/heads/main'
      && needs.discover.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: terramate-io/terramate-action@1cc78a548efefaab7762f4d06f51aa6de06ce201 # v3.3.0
        with:
          version: "0.17.3"

      - name: Install OpenTofu (identical pin to the plan job)
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: "1.13.2"
          tofu_wrapper: false

      - name: Install the Terramantle CLI
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -LsSf \
            "https://github.com/terramantle/terramantle-cli/releases/download/v0.11.0/cli-installer.sh" | sh
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Download the plan digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: tfplan-sha-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests

      - name: Pull the gated plans into their stack directories
        env:
          EXPECTED: ${{ needs.discover.outputs.count }}
          STACKS_JSON: ${{ needs.discover.outputs.stacks }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          digests=("$RUNNER_TEMP"/digests/*.digest)
          if [ "${#digests[@]}" -ne "$EXPECTED" ]; then
            echo "::error::expected $EXPECTED plan digests, found ${#digests[@]} — refusing to apply a partial change set"
            exit 1
          fi

          # Every plan is pulled BEFORE anything is applied, so one refused
          # plan stops the whole change set rather than half of it.
          printf '%s' "$STACKS_JSON" | jq -r '.[] | [.dir, .slug] | @tsv' > "$RUNNER_TEMP/stacks.tsv"
          while IFS=$'\t' read -r dir slug; do
            [ -n "$dir" ] || continue
            digest="$RUNNER_TEMP/digests/$slug.digest"
            test -f "$digest" || { echo "::error::no plan digest for $dir"; exit 1; }
            IFS=$'\t' read -r commit sha < "$digest"
            # A plan built from another commit would apply something the merge
            # never reviewed.
            [ "$commit" = "$GITHUB_SHA" ] || {
              echo "::error::plan for $dir was built from $commit, not $GITHUB_SHA"; exit 1; }

            # The workspace's gating plan, and only if it is byte-for-byte the
            # one the plan job made (--expect-sha). The server refuses it when
            # it is blocked and unapproved (exit 3: approve it, then re-run
            # this job) or when the state has moved since it was planned
            # (exit 7: re-run the whole workflow to plan again). On a refusal
            # or a mismatch no plan is written, so there is nothing to apply.
            terramantle plan pull --chdir "$dir" --out tfplan --expect-sha "$sha"
          done < "$RUNNER_TEMP/stacks.tsv"

      - name: Apply
        env:
          BASE: ${{ needs.discover.outputs.base }}
          ALL: ${{ needs.discover.outputs.all }}
        run: |
          set -euo pipefail
          eval "$(terramantle auth env --terraform)"
          for v in TF_HTTP_PASSWORD TF_TOKEN_registry_terramantle_dev TF_TOKEN_acme__demo_registry_terramantle_dev; do
            eval "val=\${$v:-}"
            [ -n "$val" ] || { echo "::error::$v was not exported by 'terramantle auth env --terraform'"; exit 1; }
          done
          echo "::add-mask::$TF_HTTP_PASSWORD"

          # `terramate run` honours each stack's before/after ordering, which a
          # parallel matrix cannot. A pulled plan carries no .terraform/
          # directory, so every stack re-inits here against its committed
          # .terraform.lock.hcl and the identical OpenTofu pin.
          #
          # tfplan must be gitignored or Terramate's git-untracked safeguard
          # aborts the run before the first stack.
          if [ "$ALL" = "1" ]; then
            terramate run -- tofu init -input=false -no-color
            terramate run -- tofu apply -input=false -lock-timeout=300s -no-color tfplan
          else
            terramate run --changed --git-change-base "$BASE" -- tofu init -input=false -no-color
            terramate run --changed --git-change-base "$BASE" -- tofu apply -input=false -lock-timeout=300s -no-color tfplan
          fi
          # No -auto-approve: it is ignored when a saved plan is supplied, since
          # passing the plan file IS the approval.

  # ── 5. publish lock files + posture gate ───────────────────────────────────
  publish:
    name: publish lock files
    needs: [discover, apply]
    # always(), so the posture gate still runs when apply was skipped for having
    # nothing to change — it is a continuous check, not a function of this diff.
    if: >-
      always()
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && github.ref == 'refs/heads/main'
      && needs.discover.result == 'success'
      && (needs.apply.result == 'success' || needs.apply.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: terramate-io/terramate-action@1cc78a548efefaab7762f4d06f51aa6de06ce201 # v3.3.0
        with:
          version: "0.17.3"

      - name: Install the Terramantle CLI
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -LsSf \
            "https://github.com/terramantle/terramantle-cli/releases/download/v0.11.0/cli-installer.sh" | sh
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Every stack has a committed lock file
        run: |
          set -euo pipefail
          # `state publish` skips a directory without a .terraform.lock.hcl.
          # Make that loud rather than a silently short publish.
          missing=0
          while IFS= read -r dir; do
            dir="${dir#./}"
            [ -n "$dir" ] || continue
            if [ ! -f "$dir/.terraform.lock.hcl" ]; then
              echo "::error::$dir has no committed .terraform.lock.hcl — state publish would skip it"
              missing=1
            fi
          done < <(terramate list)
          [ "$missing" -eq 0 ]

      - name: Publish lock files
        # Exit 3 means the posture gate tripped on an at-risk provider.
        run: terramantle state publish --ci --fail-on-atrisk
