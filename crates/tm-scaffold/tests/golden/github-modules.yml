# managed by terramantle · template=github/modules · v=2
# Generated by `terramantle init`; re-rendered by `terramantle upgrade`.
# Edits are overwritten — change terramantle.hcl and re-run `upgrade` instead.
#
# Emitted by `terramantle init` for artefact=modules · vcs=github.
#
# A PR validates; a merge to main publishes every changed module
# to the registry and pushes its `<module>@<version>` git tag.
#
# The registry address of a module is `<org>/<name>/<provider>`, and the CLI
# derives all three from the repo: org from the manifest, and name + provider
# from the `terraform-<provider>-<name>` directory convention. A directory that
# does not follow it fails with a message saying so — pass `--provider` to
# override.
#
# Auth is keyless. `terramantle auth env --terraform` detects GITHUB_ACTIONS,
# mints the ambient OIDC token itself, and exports TF_HTTP_PASSWORD plus the
# TF_TOKEN_* registry credentials. The org must trust this repo under VCS
# Trust with subject `repo:<owner>/<repo>` or every call 401s.
name: terramantle

on:
  pull_request:
  push:
    branches: ["main"]

permissions: {}

concurrency:
  # Publishing pushes tags; two concurrent releases would race on them.
  group: terramantle-main-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  TERRAMANTLE_ORG: "acme-demo"
  TERRAMANTLE_API_URL: "https://registry.terramantle.dev"
  TF_IN_AUTOMATION: "1"
  TF_INPUT: "0"

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Change detection diffs against the last `<module>@<version>` tag.
          fetch-depth: 0
          persist-credentials: false

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: "1.13.2"
          tofu_wrapper: false

      - name: Install the Terramantle CLI
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -LsSf \
            "https://github.com/terramantle/terramantle-cli/releases/download/v0.9.3/cli-installer.sh" | sh
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - run: tofu fmt -check -recursive -no-color .

      - name: Changed modules and their next versions
        run: terramantle modules changed

      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: "v0.65.0"

      - name: tflint plugin init
        env:
          # Plugin install hits the GitHub API. Without a token the runner
          # shares one anonymous 60/hr quota by IP and fails intermittently.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test -f "$(pwd)/.tflint.hcl" || { echo "::error::.tflint.hcl is missing at the repo root"; exit 1; }
          # setup-tflint does NOT init for you, and `--recursive --init` in that
          # order is what installs plugins for every stack — a bare `--init`
          # only initialises the root directory.
          tflint --recursive --init --config "$(pwd)/.tflint.hcl"

      - name: tflint
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # In recursive mode a relative --config is resolved per directory, so
        # the single repo-root config must be passed as an absolute path.
        run: tflint --recursive --config "$(pwd)/.tflint.hcl" --format compact

  publish:
    name: publish
    needs: [validate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # `repo tag` pushes the <module>@<version> tags.
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: "1.13.2"
          tofu_wrapper: false

      - name: Install the Terramantle CLI
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -LsSf \
            "https://github.com/terramantle/terramantle-cli/releases/download/v0.9.3/cli-installer.sh" | sh
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install terraform-docs
        # `modules publish` regenerates each module README between the
        # BEGIN_TF_DOCS markers when terraform-docs is on PATH, and prints a
        # hint when it is not. Installing it here is what makes that happen;
        # there is no separate docs action, so the generated README cannot
        # disagree with what publish uploaded.
        env:
          TFDOCS_VERSION: "0.24.0"
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --proto '=https' --tlsv1.2 -fsSLO \
            "https://github.com/terraform-docs/terraform-docs/releases/download/v${TFDOCS_VERSION}/terraform-docs-v${TFDOCS_VERSION}-linux-amd64.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSLO \
            "https://github.com/terraform-docs/terraform-docs/releases/download/v${TFDOCS_VERSION}/terraform-docs-v${TFDOCS_VERSION}.sha256sum"
          grep -F "terraform-docs-v${TFDOCS_VERSION}-linux-amd64.tar.gz" \
            "terraform-docs-v${TFDOCS_VERSION}.sha256sum" > tfdocs.sha256
          sha256sum -c tfdocs.sha256
          tar -xzf "terraform-docs-v${TFDOCS_VERSION}-linux-amd64.tar.gz" terraform-docs
          install -m 0755 terraform-docs "$HOME/.cargo/bin/terraform-docs"
          terraform-docs --version

      - name: Publish changed modules
        run: terramantle modules publish --ci

      - name: Tag the released versions
        run: terramantle repo tag
