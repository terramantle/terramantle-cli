#
# Emitted by `terramantle init` for artefact=modules · vcs=gitlab.
#
# An MR validates; a merge to {{DEFAULT_BRANCH}} publishes every changed module
# to the registry and pushes its `<module>@<version>` git tag.
#
# The registry address of a module is `<org>/<name>/<provider>`, and the CLI
# derives all three from the repo: org from the manifest, and name + provider
# from the `terraform-<provider>-<name>` directory convention. A directory that
# does not follow it fails with a message saying so — pass `--provider` to
# override.
#
# Auth is keyless; the org must trust this project under VCS Trust with subject
# `{{TRUST_SUBJECT}}` or publishing 401s.
#
# !! TAG PUSHES NEED A WRITABLE REMOTE !! `terramantle repo tag` pushes tags,
# and CI_JOB_TOKEN cannot push. Create a Project Access Token with
# `write_repository`, expose it as the masked variable GIT_PUSH_TOKEN, and the
# publish job rewrites `origin` to use it.
#
# Required CI/CD variables:
#   GIT_PUSH_TOKEN  (masked) — Project Access Token with write_repository
{{GITLAB_REQUIRED_VARS}}
stages: [validate, publish]

workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web"
    - when: never

variables:
  TERRAMANTLE_ORG: "{{ORG}}"
  TERRAMANTLE_API_URL: "{{API_URL}}"
  TOFU_VERSION: "{{TOFU_VERSION}}"
  TERRAMANTLE_CLI_VERSION: "{{CLI_VERSION}}"
{{GITLAB_TFLINT_VAR}}{{GITLAB_TFDOCS_VAR}}
  # Change detection diffs against the last `<module>@<version>` tag, so the
  # full history and all tags are required.
  GIT_STRATEGY: clone
  GIT_DEPTH: "0"
  GIT_SUBMODULE_STRATEGY: none

  TF_IN_AUTOMATION: "1"
  TF_INPUT: "0"
  DEBIAN_FRONTEND: noninteractive

# Job-level `id_tokens` does NOT merge with `default:id_tokens`, so it lives in
# a hidden job pulled in with `extends:` and only lands on jobs that need it.
.oidc:
  id_tokens:
    TERRAMANTLE_ID_TOKEN:
      aud: "{{OIDC_AUDIENCE}}"

.tools:
  image: debian:stable-slim
  before_script:
    - set -eu
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends ca-certificates curl git jq tar gzip unzip coreutils
    - |
      # --- OpenTofu (pinned + checksum verified) ------------------------------
      cd /tmp
      curl --proto '=https' --tlsv1.2 -fsSLO \
        "https://github.com/opentofu/opentofu/releases/download/v${TOFU_VERSION}/tofu_${TOFU_VERSION}_linux_amd64.zip"
      curl --proto '=https' --tlsv1.2 -fsSLO \
        "https://github.com/opentofu/opentofu/releases/download/v${TOFU_VERSION}/tofu_${TOFU_VERSION}_SHA256SUMS"
      grep -F "tofu_${TOFU_VERSION}_linux_amd64.zip" "tofu_${TOFU_VERSION}_SHA256SUMS" > tofu.sha256
      sha256sum -c tofu.sha256
      unzip -oq "tofu_${TOFU_VERSION}_linux_amd64.zip" tofu -d /usr/local/bin
      chmod +x /usr/local/bin/tofu
      tofu version
    - |
      # --- Terramantle CLI (pinned release) -----------------------------------
      curl --proto '=https' --tlsv1.2 -LsSf \
        "https://github.com/terramantle/terramantle-cli/releases/download/v${TERRAMANTLE_CLI_VERSION}/cli-installer.sh" | sh
      install -m 0755 "$HOME/.cargo/bin/terramantle" /usr/local/bin/terramantle
      terramantle --version
    - cd "$CI_PROJECT_DIR"
    - git config --global --add safe.directory "$CI_PROJECT_DIR"

validate:
  stage: validate
  extends: [.tools]        # no identity needed: `modules changed` is offline
  interruptible: true
  timeout: 20m
  script:
    - tofu fmt -check -recursive -no-color .
    - terramantle modules changed
{{LINT_STEPS}}
publish:
  stage: publish
  extends: [.tools, .oidc]
  interruptible: false
  resource_group: terramantle-publish-$CI_COMMIT_REF_SLUG
  timeout: 30m
  needs: ["validate"]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - when: never
  script:
    - |
      set -eu
      if [ -z "${GIT_PUSH_TOKEN:-}" ]; then
        echo "ERROR: CI/CD variable GIT_PUSH_TOKEN is not set."
        echo "ERROR: 'terramantle repo tag' pushes git tags and CI_JOB_TOKEN cannot push."
        echo "ERROR: Create a Project Access Token with write_repository and add it masked."
        exit 1
      fi
      # Rewrite origin so the tag push authenticates. The token is masked in
      # the job log by GitLab, and the remote URL is never echoed.
      git remote set-url origin \
        "https://gitlab-ci-token:${GIT_PUSH_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
      git config user.email "ci@${CI_SERVER_HOST}"
      git config user.name "Terramantle CI"
{{DOCS_STEPS}}    - terramantle modules publish --ci
    - terramantle repo tag
